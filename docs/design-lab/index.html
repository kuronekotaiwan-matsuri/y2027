<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-lab | 黒猫台湾まつり2027</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #e9e7e3;
    color: #222;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  figure { margin: 0; }
  [hidden] { display: none !important; }

  /* ツールバー */
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 8px 14px; background: #2b2b2b; color: #eee;
  }
  .bar h1 { font-size: 14px; margin: 0 8px 0 0; font-weight: 600; }
  .bar select, .bar button, .bar a.btn {
    font: inherit; padding: 5px 10px; border-radius: 6px;
    border: 1px solid #555; background: #3a3a3a; color: #eee; cursor: pointer; text-decoration: none;
  }
  .bar select { min-width: 220px; }
  .bar button.active { background: #f2f2f2; color: #222; border-color: #f2f2f2; }
  .bar .group { display: flex; gap: 4px; align-items: center; }
  .bar .label { font-size: 12px; color: #aaa; margin-right: 2px; }
  .bar .hint { margin-left: auto; font-size: 12px; color: #aaa; }

  /* 案の説明 */
  .desc { padding: 6px 14px; background: #f7f6f3; border-bottom: 1px solid #ddd; font-size: 13px; }
  .desc b { margin-right: 8px; }

  /* ステージ */
  .stage { flex: 1; min-height: 0; overflow: auto; }

  /* 並べて見る */
  .compare { display: flex; gap: 16px; padding: 16px; height: 100%; align-items: stretch; }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .pane figcaption { font-size: 12px; color: #666; margin-bottom: 6px; }
  .pane iframe {
    border: 0; background: #fff; flex: 1; width: 100%;
    box-shadow: 0 2px 12px rgba(0,0,0,.15); border-radius: 8px;
  }
  .pane--mobile { flex: none; width: 390px; }
  .pane--desktop { flex: 1; }
  .pane--desktop iframe { max-width: var(--desk, 1280px); margin: 0 auto; }

  /* 10案一覧 */
  .overview {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
    gap: 18px; padding: 18px;
  }
  .thumb {
    background: #fff; border-radius: 8px; overflow: hidden; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.12); border: 3px solid transparent;
  }
  .thumb.active { border-color: #c0392b; }
  .thumb header {
    padding: 8px 10px; font-size: 13px; font-weight: 600;
    background: #fafafa; border-bottom: 1px solid #eee;
  }
  .thumb header small { display: block; font-weight: 400; color: #777; font-size: 11px; }
  .thumb .frame { width: 100%; height: 540px; overflow: hidden; position: relative; }
  .thumb iframe {
    border: 0; width: 390px; height: calc(540px / 0.56);
    transform: scale(0.56); transform-origin: 0 0; pointer-events: none;
    position: absolute; left: 50%; margin-left: -109px;
  }
</style>
</head>
<body>
  <div class="bar">
    <h1>design-lab</h1>
    <div class="group">
      <button id="prev" title="前の案 (←)">‹</button>
      <select id="theme" aria-label="デザイン案"></select>
      <button id="next" title="次の案 (→)">›</button>
    </div>
    <div class="group" id="views">
      <button data-view="compare">並べて見る</button>
      <button data-view="overview">10案一覧</button>
    </div>
    <div class="group" id="widths">
      <span class="label">PC幅</span>
      <button data-w="1024">1024</button>
      <button data-w="1280">1280</button>
      <button data-w="1600">1600</button>
    </div>
    <a class="btn" id="open" target="_blank" rel="noopener">新しいタブで開く</a>
    <span class="hint">キー: 1〜9, 0 で案を選択 ／ ← → で前後</span>
  </div>
  <div class="desc"><b id="descName"></b><span id="descNote"></span></div>

  <div class="stage">
    <div class="compare" id="compare">
      <figure class="pane pane--mobile">
        <figcaption>モバイル 390px</figcaption>
        <iframe id="ifMobile" title="モバイル表示"></iframe>
      </figure>
      <figure class="pane pane--desktop">
        <figcaption id="capDesk">PC</figcaption>
        <iframe id="ifDesk" title="PC表示"></iframe>
      </figure>
    </div>
    <div class="overview" id="overview" hidden></div>
  </div>

  <script src="themes.js"></script>
  <script>
  (function () {
    var THEMES = window.LAB_THEMES;
    var state = { theme: "01", view: "compare", width: 1280 };
    try {
      var saved = JSON.parse(localStorage.getItem("design-lab") || "{}");
      if (saved && typeof saved === "object") {
        if (THEMES.some(function (t) { return t.id === saved.theme; })) state.theme = saved.theme;
        if (saved.view === "compare" || saved.view === "overview") state.view = saved.view;
        if ([1024, 1280, 1600].indexOf(saved.width) >= 0) state.width = saved.width;
      }
    } catch (e) {}
    // URL パラメータで初期状態を指定できる（例: index.html?theme=03&view=overview）
    var qTheme = location.search.match(/theme=([0-9]{2})/);
    if (qTheme && THEMES.some(function (t) { return t.id === qTheme[1]; })) state.theme = qTheme[1];
    var qView = location.search.match(/view=(compare|overview)/);
    if (qView) state.view = qView[1];

    var $ = function (id) { return document.getElementById(id); };
    var select = $("theme");
    var ifMobile = $("ifMobile");
    var ifDesk = $("ifDesk");
    var overview = $("overview");
    var overviewBuilt = false;

    // セレクトボックスを組み立てる
    THEMES.forEach(function (t) {
      var opt = document.createElement("option");
      opt.value = t.id;
      opt.textContent = t.id + "  " + t.name;
      select.appendChild(opt);
    });

    function themeById(id) {
      return THEMES.filter(function (t) { return t.id === id; })[0];
    }

    function save() {
      try { localStorage.setItem("design-lab", JSON.stringify(state)); } catch (e) {}
    }

    function sampleUrl(id) { return "sample.html#" + id; }

    function render() {
      var t = themeById(state.theme);
      select.value = state.theme;
      $("descName").textContent = "案" + t.id + " " + t.name;
      $("descNote").textContent = t.note;
      $("open").href = sampleUrl(state.theme);

      // iframe はハッシュだけを変える（再読み込みせず hashchange で切り替わる）
      if (ifMobile.getAttribute("src") !== sampleUrl(state.theme)) ifMobile.src = sampleUrl(state.theme);
      if (ifDesk.getAttribute("src") !== sampleUrl(state.theme)) ifDesk.src = sampleUrl(state.theme);

      document.documentElement.style.setProperty("--desk", state.width + "px");
      $("capDesk").textContent = "PC " + state.width + "px";
      Array.prototype.forEach.call(document.querySelectorAll("#widths button"), function (b) {
        b.classList.toggle("active", Number(b.dataset.w) === state.width);
      });
      Array.prototype.forEach.call(document.querySelectorAll("#views button"), function (b) {
        b.classList.toggle("active", b.dataset.view === state.view);
      });

      var isOverview = state.view === "overview";
      $("compare").hidden = isOverview;
      overview.hidden = !isOverview;
      if (isOverview) {
        if (!overviewBuilt) buildOverview();
        Array.prototype.forEach.call(overview.children, function (el) {
          el.classList.toggle("active", el.dataset.id === state.theme);
        });
      }
      save();
    }

    function buildOverview() {
      THEMES.forEach(function (t) {
        var card = document.createElement("div");
        card.className = "thumb";
        card.dataset.id = t.id;
        card.innerHTML =
          '<header>案' + t.id + " " + t.name + "<small></small></header>" +
          '<div class="frame"><iframe title="案' + t.id + '" src="' + sampleUrl(t.id) + '"></iframe></div>';
        card.querySelector("small").textContent = t.note;
        card.addEventListener("click", function () {
          state.theme = t.id;
          state.view = "compare";
          render();
        });
        overview.appendChild(card);
      });
      overviewBuilt = true;
    }

    function step(delta) {
      var idx = THEMES.findIndex(function (t) { return t.id === state.theme; });
      idx = (idx + delta + THEMES.length) % THEMES.length;
      state.theme = THEMES[idx].id;
      render();
    }

    select.addEventListener("change", function () { state.theme = select.value; render(); });
    $("prev").addEventListener("click", function () { step(-1); });
    $("next").addEventListener("click", function () { step(1); });
    Array.prototype.forEach.call(document.querySelectorAll("#views button"), function (b) {
      b.addEventListener("click", function () { state.view = b.dataset.view; render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#widths button"), function (b) {
      b.addEventListener("click", function () { state.width = Number(b.dataset.w); render(); });
    });

    document.addEventListener("keydown", function (e) {
      if (e.target && (e.target.tagName === "SELECT" || e.target.tagName === "INPUT")) return;
      if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); return; }
      if (e.key === "ArrowRight") { step(1); e.preventDefault(); return; }
      if (/^[0-9]$/.test(e.key)) {
        var id = e.key === "0" ? "10" : "0" + e.key;
        if (themeById(id)) { state.theme = id; render(); }
      }
    });

    render();
  })();
  </script>
</body>
</html>
